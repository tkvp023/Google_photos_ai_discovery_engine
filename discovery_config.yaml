    - "natural_language_understanding"
    - "facial_recognition"
    - "text_ocr_detection"
    - "timeline_navigation"
    - "clutter_filtering"
    - "album_organization"
    - "search_speed_responsiveness"

  intent_types:
    - "vague_episodic_recall"
    - "utility_document_retrieval"
    - "specific_person_search"
    - "casual_nostalgic_browsing"
    - "cleanup_and_organization"
    - "unknown"

  user_segments:
    age_groups: ["gen_z", "millennial", "gen_x", "unknown"]
    price_sensitivity: ["high", "medium", "low", "unknown"]
    engagement_level: ["power_user", "casual", "hoarder", "unknown"]
    gender_signals: ["male", "female", "non_binary", "unknown"]

  competitor_platforms:
    - "apple_photos"
    - "amazon_photos"
    - "onedrive"
    - "dropbox"
    - "samsung_gallery"
    - "whatsapp"
    - "instagram"
    - "other"

  external_info_types:
    - "whatsapp_chat_history"
    - "social_media_posts"
    - "calendar_lookup"
    - "ask_family_friends"
    - "google_search"
    - "bank_statements"
    - "other"

