# ─── 7. EXAMPLE REVIEWS (FEW-SHOT) ───────────────────────────

few_shot_examples:
  - input: >
      I spent 45 minutes trying to find that picture of the seafood paella we ate at a beach shack during our Valencia trip three years ago.
      I searched 'paella beach', 'spain seafood', 'beach restaurant', and got either random beach pictures or nothing.
      I don't remember the exact restaurant name or the date, so I had to endlessly scroll through August 2023 until my eyes hurt.
    expected_output:
      hesitation_reasons:
        - reason: "query_too_literal"
          confidence: 0.95
          evidence_quote: "searched 'paella beach', 'spain seafood', 'beach restaurant', and got either random beach pictures or nothing"
        - reason: "forgot_exact_date"
          confidence: 0.90
          evidence_quote: "I don't remember the exact restaurant name or the date"
        - reason: "endless_scrolling_fatigue"
          confidence: 0.92
          evidence_quote: "had to endlessly scroll through August 2023 until my eyes hurt"
      intent: "vague_episodic_recall"
      age_group: "millennial"
      price_sensitivity: "medium"
      platforms_mentioned: []
      unmet_needs:
        - "Semantic search that understands contextual memories like vacations and meals"
        - "Visual filters to eliminate unrelated beach photos without exact dates"

  - input: >
      Trying to find an old prescription medicine bottle photo from last winter.
      When I search 'medicine' or 'prescription', Google Photos gives me dozens of random WhatsApp screenshots, insurance paperwork, and memes.
      Apple Photos on my iPad at least lets me filter by text inside images much better.
    expected_output:
      hesitation_reasons:
        - reason: "screenshot_and_junk_clutter"
          confidence: 0.95
          evidence_quote: "gives me dozens of random WhatsApp screenshots, insurance paperwork, and memes"
        - reason: "text_ocr_detection_failure"
          confidence: 0.88
          evidence_quote: "Apple Photos on my iPad at least lets me filter by text inside images much better"
        - reason: "competitor_switching_apple"
          confidence: 0.85
          evidence_quote: "Apple Photos on my iPad at least lets me filter by text inside images much better"
      intent: "utility_document_retrieval"
      age_group: "gen_x"
      price_sensitivity: "low"
      platforms_mentioned: ["apple_photos"]
      unmet_needs:
        - "Separate utility documents and medicine photos from meme screenshots"
        - "Reliable OCR text search on medication bottles"

  - input: >
      App crashes every time I open it. Fix your app!!
    expected_output:
      hesitation_reasons: []
      intent: "unknown"
      age_group: "unknown"
      price_sensitivity: "unknown"
      platforms_mentioned: []
      is_primary_signal: false
      unmet_needs:
        - "Stable app experience"
